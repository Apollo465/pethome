<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- 主题封面底层：页面底色 + 主视觉卡片。标记由 cover_mark_svg() 生成后叠在中间一层 -->
  <defs>
    <linearGradient id="heroGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFB77F"/>
      <stop offset="0.48" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#ED6534"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="#FFF9F6"/>
  <rect x="64" y="140" width="952" height="760" rx="64" fill="url(#heroGrad)"/>
  <rect x="64" y="140" width="952" height="760" rx="64" fill="url(#glow)"/>
</svg>
